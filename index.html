<style>
:root{
  --bg:#F2F7F3; --surface:#FFFFFF; --ink:#16302A; --muted:#4D6A60; --line:#D5E3DA;
  --leaf:#1F6B4A; --leaf-ink:#FFFFFF; --sun:#F3B33D; --orange:#E8743B; --water:#3C8DAD; --soft:#E4F0E8;
  --display:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1D18; --surface:#172A23; --ink:#E6F1EA; --muted:#9DB8AB; --line:#27403A;
    --leaf:#5CC495; --leaf-ink:#0F1D18; --sun:#F3B33D; --orange:#F08A57; --water:#6BB5D3; --soft:#1D3329;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1D18; --surface:#172A23; --ink:#E6F1EA; --muted:#9DB8AB; --line:#27403A;
  --leaf:#5CC495; --leaf-ink:#0F1D18; --sun:#F3B33D; --orange:#F08A57; --water:#6BB5D3; --soft:#1D3329;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.08;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(2.4rem,6.2vw,4.4rem);font-weight:800}
h2{font-size:clamp(1.8rem,4vw,2.7rem);font-weight:700}
h3{font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(18px,4vw,32px)}
section{padding:clamp(56px,9vw,104px) 0}

/* Nav */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:50% 0 50% 0;background:var(--leaf);display:inline-block;transform:rotate(-10deg)}
.nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0}
.nav a.l{text-decoration:none;color:var(--muted);font-weight:500;font-size:.98rem}
.nav a.l:hover{color:var(--ink)}
@media(max-width:720px){.nav ul{display:none}}
